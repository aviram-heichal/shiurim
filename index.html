<title>שיעורי חשבון | אבירם היכל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8ec;--ink:#1b2a4a;--muted:#5d6b88;--navy:#1b2a4a;--gold:#e0a82e;--no:#d0553a;--line:#e4dcc6;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:19px;direction:rtl;padding-inline:16px}
.box{max-width:430px;margin:6vh auto 40px;background:#fff;border-radius:26px;box-shadow:0 14px 40px rgba(27,42,74,.13);padding:28px 24px 26px;text-align:center}
.face{width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 6px 18px rgba(27,42,74,.2);background:#f3d9a4}
h1{font-size:30px;margin:12px 0 4px;line-height:1.2}
.sub{color:var(--muted);font-size:17px;margin-bottom:20px}
label{display:block;text-align:right;font-weight:700;margin:14px 2px 6px;font-size:17px}
input{width:100%;font:inherit;font-size:21px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fffdf7;color:var(--ink);direction:ltr;text-align:right}
input:focus{outline:none;border-color:var(--gold)}
.pw{position:relative}
.pw button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:15px;color:var(--muted);font-family:inherit;cursor:pointer;padding:6px}
.go{margin-top:22px;width:100%;border:0;border-radius:16px;background:var(--navy);color:#fff;font:inherit;font-size:22px;font-weight:800;padding:15px;cursor:pointer;box-shadow:0 5px 0 #0e1830}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #0e1830}
.go:disabled{opacity:.6}
.err{color:var(--no);font-weight:700;min-height:26px;margin-top:12px;font-size:17px}
.help{color:var(--muted);font-size:15px;margin-top:16px;line-height:1.5}
.brand{color:var(--muted);font-size:14px;margin-top:18px}
#loading{text-align:center;margin-top:30vh;font-size:22px;color:var(--muted)}
.spin{display:inline-block;width:38px;height:38px;border:5px solid #e8dfc6;border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin-bottom:12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
